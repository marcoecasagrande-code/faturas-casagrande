<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Financeiro Casagrande</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2341C9"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financeiro"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-shim.js"></script>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: irmão do Viagens Casagrande. Marca em duas cores, abas com destaque laranja, faixa de resumo tracejada, painéis de 12px e fundo pontilhado no topo. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#ECEFF4; --fg:#141C2B; --muted:#5A6577; --line:#DCE1EA; --dots:#C7D0DE;
  --accent:#2341C9; --accent-fg:#FFFFFF; --accent-soft:#E6EBFC;
  --orange:#C2410C; --orange-soft:#FDEBDD;
  --up:#B42318; --down:#14794A; --warn:#9A5B00; --warn-soft:#FDF0D8;
  --c0:#2341C9; --c1:#C2410C; --c2:#0F7A6E; --c3:#B4235A; --c4:#7A3EC2; --c5:#8A6400; --c6:#36577A; --c7:#4D6B12;
  --c8:#1D86B8; --c9:#C9720A; --c10:#9B3F8A; --c11:#23824F; --c12:#7A5630; --c13:#5664D2; --c14:#C0563A;
  --c-outros:#7C869A; --c-rest:#AEB6C4; --dollar:#9FAFD3;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#161D2A; --surface-2:#1F2735; --fg:#E8ECF4; --muted:#9AA4B6; --line:#283244; --dots:#222C3D;
  --accent:#8EA2FF; --accent-fg:#0E131D; --accent-soft:#1E2747;
  --orange:#FF9A4D; --orange-soft:#3A2010;
  --up:#FF8A80; --down:#5BD49A; --warn:#F2B866; --warn-soft:#33260E;
  --c0:#8EA2FF; --c1:#FF9F6B; --c2:#5FD3C3; --c3:#FF8DB8; --c4:#C9A3F5; --c5:#F0C75E; --c6:#9DBCE0; --c7:#B5D66A;
  --c8:#6CC6F0; --c9:#FBBF5A; --c10:#E59AD6; --c11:#6FD49B; --c12:#D2AE84; --c13:#A7B2FF; --c14:#F39C82;
  --c-outros:#8D96A8; --c-rest:#4A5466; --dollar:#42537A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#161D2A; --surface-2:#1F2735; --fg:#E8ECF4; --muted:#9AA4B6; --line:#283244; --dots:#222C3D;
  --accent:#8EA2FF; --accent-fg:#0E131D; --accent-soft:#1E2747;
  --orange:#FF9A4D; --orange-soft:#3A2010;
  --up:#FF8A80; --down:#5BD49A; --warn:#F2B866; --warn-soft:#33260E;
  --c0:#8EA2FF; --c1:#FF9F6B; --c2:#5FD3C3; --c3:#FF8DB8; --c4:#C9A3F5; --c5:#F0C75E; --c6:#9DBCE0; --c7:#B5D66A;
  --c8:#6CC6F0; --c9:#FBBF5A; --c10:#E59AD6; --c11:#6FD49B; --c12:#D2AE84; --c13:#A7B2FF; --c14:#F39C82;
  --c-outros:#8D96A8; --c-rest:#4A5466; --dollar:#42537A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);overflow-x:clip}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* topo */
header.top{position:relative;isolation:isolate;padding-top:20px}
.impwrap{position:relative;display:inline-flex;isolation:isolate}
.impwrap .dots{position:absolute;left:50%;top:50%;width:250px;transform:translate(-50%,-44%);z-index:-1;pointer-events:none}
.impwrap .dots svg{display:block;width:100%;height:auto}
.impwrap .dots circle{fill:var(--dollar)}
.impwrap .btn{box-shadow:0 0 0 4px var(--bg),0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.bar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:4px 14px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0;font-family:var(--f-display);font-weight:700;font-size:clamp(24px,5vw,30px);letter-spacing:-.02em;line-height:1}
.brand svg{flex:none;width:34px;height:34px;color:var(--accent)}
.brand h1{font:inherit;margin:0}
.brand .b2{color:var(--orange)}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--down)} .dot.warn{background:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--up)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--orange);border-bottom-color:var(--orange)}

/* filtros em pílulas */
.filters{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;padding-block:16px}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select,input[type=text],input[type=month],input[type=password],input[type=search],textarea,input:not([type]){background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;font-size:14px}
.filters select{border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
label.lbl{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:500}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--muted)}
.banner{border-radius:10px;padding:10px 14px;background:var(--orange-soft);color:var(--fg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:13.5px;border:1px solid color-mix(in srgb,var(--orange) 35%,transparent)}
.banner strong{color:var(--orange);font-weight:600}
main{padding-bottom:56px}

/* grade e painéis */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h2{font-size:18px;font-weight:700;margin:0 0 2px}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.ph{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ph>div:first-child{margin-right:auto;min-width:0}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c3{grid-column:span 3}
@media (max-width:900px){.c8,.c4,.c6{grid-column:span 12}}

/* faixa de resumo (como o Viagens) */
.strip{grid-column:span 12;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.strip>div{padding:14px 18px;border-left:1px dashed var(--line);min-width:0}
.strip>div:first-child{border-left:0}
.strip .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.strip .s{font-size:13px;color:var(--muted)}
@media (max-width:720px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:1px dashed var(--line)}}
.up{color:var(--up)} .down{color:var(--down)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px}
.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
svg.chart{width:100%;height:auto;display:block}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-num)}
svg.chart .avg{stroke:var(--orange);stroke-width:2.4;fill:none;stroke-linejoin:round}
svg.chart .trend{stroke:var(--fg);stroke-width:1.4;stroke-dasharray:5 4;fill:none;opacity:.55}

/* ranking */
.rank{display:flex;flex-direction:column;gap:2px}
.rrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 8px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;width:100%}
.rrow:hover{background:var(--surface-2)}
.rrow[aria-pressed="true"]{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 9%,var(--surface))}
.rrow .pos{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:14px}
.rrow .nm{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.rrow .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;font-size:13.5px}
.rrow .track{grid-column:2/4;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.rrow .fill{height:100%;border-radius:99px}
.rrow .meta{grid-column:2/4;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.insights{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.insights li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.insights .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--orange-soft);color:var(--orange);flex:none}

/* tabelas */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.muted td{color:var(--muted)}
td .desc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
td select{padding:3px 8px;font-size:12.5px;max-width:180px}
.badge{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;white-space:nowrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 200px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.err{color:var(--up);font-size:13px}

/* diálogo */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(860px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,14,24,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 26px)}
.dlg header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg header h2{font-size:20px;font-weight:700;margin-right:auto}
.dlg .body{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.drop{border:1.5px dashed color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);cursor:pointer;background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{color:var(--fg);font-family:var(--f-display)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 180px}
details summary{cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:500}
textarea{width:100%;min-height:110px;font-family:var(--f-num);font-size:12px}
.prevwrap{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:7px;z-index:50;max-width:260px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:60;font-size:13.5px;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px}

/* faturas como "bilhetes" */
.cards-list{display:flex;flex-direction:column;gap:10px}
.st{display:grid;grid-template-columns:minmax(0,1fr) auto 190px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tc,var(--line));border-radius:var(--r);overflow:hidden}
.st>.sw{display:none}
.st>div:nth-child(2){padding:12px 16px;min-width:0}
.st .t{font-family:var(--f-display);font-weight:700;font-size:16px}
.st .m{font-size:12.5px;color:var(--muted)}
.st>.num{grid-column:2;grid-row:1;align-self:center;padding:12px 16px;font-family:var(--f-display);font-size:18px;font-weight:700!important}
.st>div:nth-child(2){grid-column:1;grid-row:1}
.st .rw{grid-column:3;grid-row:1 / span 2;padding:12px 14px;border-left:2px dashed var(--line);background:color-mix(in srgb,var(--bg) 55%,var(--surface));justify-content:center}
.st .rw input{width:100%}
.st>div:last-child{grid-column:1 / span 2;grid-row:2;padding:0 16px 12px}
.st>div:last-child:empty{display:none}
@media (max-width:640px){.st{grid-template-columns:minmax(0,1fr) auto}.st .rw{grid-column:1 / -1;grid-row:3;border-left:0;border-top:2px dashed var(--line)}.st>div:last-child{grid-column:1 / -1}}
.cfgs{display:flex;flex-direction:column}
.cfg{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:10px;border-top:1px dashed var(--line)}
.cfg:first-child{border-top:0;padding-top:2px}
.cfg .cname{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:15px;min-width:130px}
.cfg .inl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.cfg input{width:88px}
@media (prefers-reduced-motion:no-preference){.rrow .fill{transition:width .35s ease}.rrow,.btn{transition:border-color .15s,background .15s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><svg viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="3" y="7" width="28" height="20" rx="3.5" stroke="currentColor" stroke-width="2"/><path d="M3 13h28" stroke="currentColor" stroke-width="3"/><path d="M8 21.5h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="25" cy="21.5" r="2.2" fill="#C2410C"/></svg><h1><span class="b1">Financeiro</span> <span class="b2">Casagrande</span></h1></div>
      <span class="status" id="status"><span class="dot"></span><span>Carregando…</span></span>
      <span class="impwrap"><span class="dots" aria-hidden="true"><svg viewBox="0 0 300 330"><defs><pattern id="dotp" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="2.1"/></pattern><mask id="dolm"><text x="150" y="282" text-anchor="middle" font-size="340" font-weight="700" font-family="Bricolage Grotesque, Inter, Arial, sans-serif" fill="#fff">$</text></mask></defs><rect width="300" height="330" fill="url(#dotp)" mask="url(#dolm)"/></svg></span><button class="btn primary" id="btnImport" type="button">+ Importar fatura</button></span>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-view="overview" aria-selected="true" type="button">Visão geral</button>
      <button role="tab" data-view="tx" aria-selected="false" type="button">Lançamentos</button>
      <button role="tab" data-view="statements" aria-selected="false" type="button">Faturas e cartões</button>
      <button role="tab" data-view="rules" aria-selected="false" type="button">Categorias e backup</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="filters" id="filters">
    <div class="seg" id="periodSeg" aria-label="Período">
      <button type="button" data-p="3" aria-pressed="false">3 meses</button>
      <button type="button" data-p="6" aria-pressed="true">6 meses</button>
      <button type="button" data-p="12" aria-pressed="false">12 meses</button>
      <button type="button" data-p="0" aria-pressed="false">Tudo</button>
    </div>
    <select id="cardSel" aria-label="Cartão"><option value="all">Todos os cartões</option></select>
    <div class="seg" id="personSeg" aria-label="Pessoa" hidden></div>
    <span class="note" id="rangeNote"></span>
  </div>
  <div id="bannerArea"></div>
  <section id="view"></section>
</main>

<dialog id="dlg">
  <div class="dlg">
    <header><h2>Importar fatura</h2><button class="btn small" type="button" id="dlgClose">Fechar</button></header>
    <div class="body">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Escolher arquivo da fatura">
        <strong>Arraste uma ou várias faturas aqui</strong> ou clique para escolher<br>
        <span class="note">PDF, CSV, OFX ou TXT. Pode escolher vários meses de uma vez. Os arquivos são lidos só no seu navegador.</span>
        <input type="file" id="file" accept=".pdf,.csv,.ofx,.qfx,.txt" multiple hidden>
      </div>
      <div id="pwdRow" class="row" hidden>
        <label class="lbl">Senha do PDF (muitos bancos usam os primeiros dígitos do CPF)
          <input type="password" id="pwd" autocomplete="off">
        </label>
        <button class="btn" type="button" id="pwdGo" style="flex:0 0 auto">Abrir PDF</button>
        <label class="note" style="flex-basis:100%;display:flex;gap:6px;align-items:center"><input type="checkbox" id="pwdRemember" checked> Lembrar esta senha neste aparelho (as próximas faturas com a mesma senha abrem sozinhas)</label>
      </div>
      <details id="pasteBox">
        <summary>Ou cole o texto da fatura (uma compra por linha: data, descrição, valor)</summary>
        <textarea id="pasteTxt" placeholder="03/10 IFOOD *RESTAURANTE 54,90&#10;05/10 POSTO SHELL 210,00&#10;07/10 MAGAZINE LUIZA PARC 02/10 189,90"></textarea>
        <div style="margin-top:8px"><button class="btn small" type="button" id="pasteGo">Ler texto colado</button></div>
      </details>

    if (cfg.unit === "usd") { fx = cfg.fx > 0 ? cfg.fx : autoFx(st); if (fx) value = (dom * cfg.rate + intl * rI) / fx; }

    <div><div class="eyebrow">Parcelas a vencer</div><div class="v">${BRL0.format(future)}</div><div class="s">${futureN ? futureN + " compra" + (futureN > 1 ? "s" : "") + " parcelada" + (futureN > 1 ? "s" : "") + " em aberto" : "nenhum parcelamento em aberto"}</div></div>
    </section>

      <div class="rank">${catRank.map(([c, val], i) => { const p = pct(catTot[c], catPrev[c] || 0); const hasPrev = inPrev.length > 0;
        return `<button class="rrow" type="button" data-cat="${esc(c)}" aria-pressed="${focus === c}"><span class="pos">${i + 1}</span><span class="nm"><i class="sw" style="background:${catColor(c)}"></i>${esc(c)}</span><span class="amt">${BRL0.format(val)}</span><span class="track"><span class="fill" style="display:block;width:${(val / maxCat * 100).toFixed(1)}%;background:${catColor(c)}"></span></span><span class="meta"><span>${(val / total * 100).toLocaleString("pt-BR", {maximumFractionDigits: 1})}% do total</span><span>${!hasPrev ? "" : p == null ? "novo" : '<span class="' + (p > 0 ? "up" : "down") + '">' + (p > 0 ? "▲ " : "▼ ") + fmtPct(p) + "</span>"}</span></span></button>`; }).join("")}</div>

function rewardsPanel(months) {
  const sts = (STATE.demo ? DEMO : STATE.statements).filter(s => (STATE.card === "all" || s.card === STATE.card) && months.includes(s.month));
  const rows = {}; sts.forEach(s => { const r = rewardFor(s); if (!r) return; (rows[s.card] = rows[s.card] || {})[s.month] = r; });
  const cards = Object.keys(rows).sort((a, b) => a.localeCompare(b, "pt-BR"));
  if (!cards.length) return `<div class="panel c12"><div class="ph"><div><h2>Pontos e cashback</h2><p class="hint">Diga como cada cartão rende (pontos por real ou dólar, ou % de cashback) para acompanhar mês a mês.</p></div><button class="btn small primary" type="button" data-act="goCards">Configurar cartões</button></div></div>`;
  let cb = 0, pts = 0, ptsBrl = 0, ptsAllBrl = true, brlTot = 0, spendTot = 0, est = false;
  const body = cards.map(c => {
    let cTot = 0, cBrl = 0, cSpend = 0, cAllBrl = true, type = null;
    const cells = months.map(m => { const r = rows[c][m]; if (!r) return '<td class="r note">—</td>'; type = r.type;
      if (r.value != null) { cTot += r.value; cSpend += r.spend; if (r.brl != null) cBrl += r.brl; else cAllBrl = false; if (r.src === "estimado") est = true; }
      const tipTxt = r.value == null ? "Informe a taxa do cartão" : (r.src === "estimado" ? "Estimado sobre " + BRL.format(r.spend) + " em compras" + (r.fx ? " · dólar " + r.fx.toFixed(2).replace(".", ",") + (r.fxAuto ? " (da fatura)" : "") : "") : r.src === "fatura" ? "Cashback creditado na fatura" : "Valor informado por você") + (r.type === "pts" && r.brl != null ? " · ≈ " + BRL.format(r.brl) : "");
      return `<td class="r num" data-tip="${esc(tipTxt)}">${SRC_MARK[r.src] || ""}${esc(fmtReward(r))}</td>`; }).join("");

  ${est ? '<p class="note" style="margin:8px 0 0">≈ estimado pela taxa do cartão sobre as compras (sem IOF, juros e anuidade). Cashback creditado na fatura e valores que você digita em Faturas substituem a estimativa.</p>' : ""}</div>`;
}

function trendSVG(months, data, cats) {
  const W = 720, H = 270, L = 58, R = 14, T = 12, B = 30;
  const totals = months.map(m => cats.reduce((a, c) => a + (data[m][c] || 0), 0));
  const max = niceMax(Math.max(...totals, 1));
  const iw = W - L - R, ih = H - T - B, bw = iw / months.length;
  const y = val => T + ih - val / max * ih;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gastos mensais">`;
  for (let i = 0; i <= 4; i++) { const val = max * i / 4; s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(val)}" y2="${y(val)}"/><text class="ax" x="${L - 8}" y="${y(val) + 4}" text-anchor="end">${shortBRL(val)}</text>`; }
  const step = months.length > 12 ? Math.ceil(months.length / 12) : 1;
  months.forEach((m, i) => {
    let acc = 0; const w = Math.min(bw * 0.62, 56), x = L + i * bw + (bw - w) / 2;
    cats.forEach(c => { const val = data[m][c] || 0; if (val <= 0) return; const y0 = y(acc), y1 = y(acc + val);
      s += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, y0 - y1 - 0.8).toFixed(1)}" style="fill:${catColor(c)}" rx="2" data-tip="${esc(monthLabel(m) + " · " + c + ": " + BRL.format(val))}"/>`; acc += val; });
    s += `<rect x="${(L + i * bw).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent" data-tip="${esc(monthLabel(m) + " · total " + BRL.format(totals[i]))}" style="pointer-events:${acc ? "none" : "all"}"/>`;
    if (i % step === 0) s += `<text class="ax" x="${(L + i * bw + bw / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle">${monthLabel(m)}</text>`;
  });
  const cx = i => L + i * bw + bw / 2;
  if (months.length >= 3) {
    const ma = totals.map((_, i) => { const a = totals.slice(Math.max(0, i - 2), i + 1); return a.reduce((p, q) => p + q, 0) / a.length; });
    s += `<polyline class="avg" points="${ma.map((v2, i) => cx(i).toFixed(1) + "," + y(v2).toFixed(1)).join(" ")}"/>`;
    ma.forEach((v2, i) => s += `<circle cx="${cx(i).toFixed(1)}" cy="${y(v2).toFixed(1)}" r="${i === ma.length - 1 ? 4.5 : 2.8}" style="fill:var(--orange);stroke:var(--surface);stroke-width:1.5" data-tip="${esc("Média móvel " + monthLabel(months[i]) + ": " + BRL.format(v2))}"/>`);
  }
  if (months.length >= 2) {
    const n = totals.length, xm = (n - 1) / 2, ym = totals.reduce((a, b) => a + b, 0) / n; let nu = 0, de = 0;
    totals.forEach((v2, i) => { nu += (i - xm) * (v2 - ym); de += (i - xm) ** 2; }); const b = de ? nu / de : 0, a = ym - b * xm;
    s += `<line class="trend" x1="${cx(0)}" y1="${y(Math.max(0, a))}" x2="${cx(n - 1)}" y2="${y(Math.max(0, a + b * (n - 1)))}"/>`;
  }
  return s + "</svg>";
}

function cardSVG(months, byCard, colorOf) {
  const W = 560, H = 220, L = 58, R = 14, T = 12, B = 28;
  const cards = Object.keys(byCard);
  const max = niceMax(Math.max(1, ...cards.flatMap(c => months.map(m => byCard[c][m]))));
  const iw = W - L - R, ih = H - T - B, n = months.length;
  const x = i => n === 1 ? L + iw / 2 : L + i * iw / (n - 1), y = v => T + ih - v / max * ih;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gastos por cartão">`;
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${shortBRL(v)}</text>`; }
  const step = n > 8 ? Math.ceil(n / 8) : 1;
  months.forEach((m, i) => { if (i % step === 0 || i === n - 1) s += `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${monthLabel(m)}</text>`; });
  cards.forEach(c => {
    const col = colorOf(c);
    s += `<polyline points="${months.map((m, i) => x(i).toFixed(1) + "," + y(byCard[c][m]).toFixed(1)).join(" ")}" fill="none" style="stroke:${col}" stroke-width="2.4" stroke-linejoin="round"/>`;
    months.forEach((m, i) => s += `<circle cx="${x(i).toFixed(1)}" cy="${y(byCard[c][m]).toFixed(1)}" r="${i === n - 1 ? 4.5 : 3}" style="fill:${col};stroke:var(--surface);stroke-width:1.5" data-tip="${esc(c + " · " + monthLabel(m) + ": " + BRL.format(byCard[c][m]))}"/>`);
  });
  return s + "</svg>";
}

async function exportBackup() {
  const data = JSON.stringify({app: "faturas-casagrande", versao: 1, exportadoEm: new Date().toISOString(), statements: STATE.statements, settings: STATE.settings});
  const filename = "faturas-casagrande-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  const msgEl = $("#bkMsg");
  if (!window.__fbLogin && window.claude && window.claude.use) {
    const dl = await window.claude.use("downloads").catch(() => null);
    if (!dl) { msgEl.textContent = "Este navegador não permite baixar arquivos daqui."; return; }
    try { await dl.save({filename, data: new Blob([data], {type: "application/json"})}); msgEl.textContent = "Backup salvo."; }
    catch (e) { msgEl.textContent = e && e.code === "declined" ? "" : "Não foi possível salvar o backup."; }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type: "application/json"})); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  msgEl.textContent = "Backup baixado.";
}
async function importBackup(file) {
  const msgEl = $("#bkMsg");
  try {
    const j = JSON.parse(await file.text());
    const sts = (j.statements || []).filter(s => s && s.kind === "statement" && s.id && s.card && /^\d{4}-\d{2}$/.test(s.month) && Array.isArray(s.tx));
    if (!sts.length && !j.settings) throw new Error("vazio");
    sts.forEach(s => { const dup = STATE.statements.find(x => x.card === s.card && x.month === s.month && x.id !== s.id); if (dup) Store.deleteStatement(dup.id); Store.saveStatement(s); });
    if (j.settings) {
      STATE.settings.rules = Object.assign({}, STATE.settings.rules, j.settings.rules || {});
      STATE.settings.customCats = [...new Set((STATE.settings.customCats || []).concat(j.settings.customCats || []))];
      STATE.settings.cards = Object.assign({}, j.settings.cards || {}, STATE.settings.cards || {});
      Store.saveSettings();
    }
    render(); toast(sts.length + " fatura" + (sts.length === 1 ? "" : "s") + " importada" + (sts.length === 1 ? "" : "s") + ".");
  } catch (e) { if (msgEl) msgEl.textContent = "Arquivo de backup inválido."; }
}

  const n = parseFloat(s); return isNaN(n) ? null : (neg ? -n : n);
}

  const ref = $("#impMonth").value, card = $("#impCard").value.trim();

  const tx = IMP.rows.filter(r => r.keep).map(r => ({id: uid(), date: toISO(r.d, ref), desc: r.desc.slice(0, 120), amount: Math.round(r.amount * 100) / 100, inst: r.inst || null, orig: r.orig || null, who: r.who || null, final: r.final || null, cat: null, ign: false})).filter(t => t.date).sort((a, b) => a.date.localeCompare(b.date));
  const dup = STATE.statements.find(s => s.card === card && s.month === ref);
  const st = {kind: "statement", id: dup ? dup.id : "st-" + uid(), card, month: ref, fileName: IMP.fileName || "texto colado", importedAt: new Date().toISOString(), tx};
  if (IMP.meta && IMP.meta.iofSaved) st.iofSaved = IMP.meta.iofSaved;
  if (JSON.stringify(st).length > 240000) { msg("Esta fatura é grande demais para um único registro. Divida o arquivo em partes.", "err"); return; }
  Store.saveStatement(st);
  closeImport(); STATE.card = "all"; STATE.view = "overview"; render();
  toast("Fatura " + card + " de " + monthLabel(ref) + " salva com " + tx.length + " lançamentos.");
}

/* ---------- várias faturas de uma vez ---------- */
async function parseFileAny(item, password) {
  const ext = (item.file.name.split(".").pop() || "").toLowerCase();
  let rows, meta = {};
  if (ext === "pdf") {
    item.buf = item.buf || await item.file.arrayBuffer();
    const {lines, pages} = await pdfLinesAuto(item.buf, password);
    meta = guessMeta(lines.join("\n"));
    const iofm = /IOF Zero[^R]*R\$\s?([\d.]+,\d{2})/i.exec(lines.join(" "));
    meta.iofSaved = iofm ? parseAmount(iofm[1]) : null;
    rows = isTwoColumn(pages) ? parsePdfColumns(pages) : parseTextLines(lines);
  } else {
    const t = await readText(item.file);
    rows = (ext === "ofx" || ext === "qfx" || /<OFX>|OFXHEADER/i.test(t)) ? parseOFX(t) : (ext === "csv" ? parseCSV(t) : parseTextLines(t.split(/\r?\n/)));
    if (!rows.length && ext !== "csv") rows = parseCSV(t);
    meta = guessMeta(t);
  }
  const neg = rows.filter(r => r.amount < 0).length;
  if (neg > rows.length - neg) rows.forEach(r => r.amount = -r.amount);
  rows.forEach(r => { if (r.amount > 0 && isCreditDesc(r.desc) && /PAGAMENTO|ESTORNO|DEVOLU|REEMBOLSO/.test(norm(r.desc))) r.amount = -r.amount; r.keep = true; r.inst = parseInst(r.desc); });
  item.rows = rows; item.meta = meta;
  item.card = item.card || meta.card || "";
  const full = rows.length && rows.every(r => /\d{4}/.test(r.d));
  const fm = /(20\d{2})[-_. ]?(0[1-9]|1[0-2])/.exec(item.file.name);
  item.month = item.month || meta.month || (fm ? fm[1] + "-" + fm[2] : "") || (full ? addMonth(rows.map(r => toISO(r.d, curMonth())).sort().pop().slice(0, 7), 1) : "");
  item.status = rows.length ? "ok" : "vazio";
}
async function handleFiles(list) {
  const files = [...list];
  if (files.length === 1) return handleFile(files[0]);
  if (!files.length) return;
  $("#singleMeta").hidden = true; $("#pasteBox").hidden = true; $("#pwdRow").hidden = true;
  const defCard = $("#impCard").value.trim();
  IMP.batch = files.map(f => ({file: f, name: f.name, status: "lendo", card: "", month: "", rows: []}));
  renderBatch();
  for (const it of IMP.batch) {
    try { await parseFileAny(it); }
    catch (e) { it.status = e && e.name === "PasswordException" ? "senha" : "erro"; }
    if (!it.card && defCard) it.card = defCard;
    renderBatch();
  }
  // cartão em branco: usa o mais comum do lote
  const common = Object.entries(IMP.batch.reduce((o, it) => { if (it.card) o[it.card] = (o[it.card] || 0) + 1; return o; }, {})).sort((a, b) => b[1] - a[1])[0];
  IMP.batch.forEach(it => { if (!it.card && common && it.status === "ok") it.card = common[0]; });
  if (IMP.batch.some(it => it.status === "senha")) { $("#pwdRow").hidden = false; msg("Alguns PDFs têm senha. Digite a senha (vale para todos) e toque em Abrir PDF.", "note"); }
  renderBatch();
}
async function retryBatchPassword(pw) {
  for (const it of IMP.batch.filter(x => x.status === "senha")) {
    try { await parseFileAny(it, pw); } catch (e) { it.status = e && e.name === "PasswordException" ? "senha" : "erro"; }
  }
  const still = IMP.batch.some(it => it.status === "senha");
  $("#pwdRow").hidden = !still; msg(still ? "Senha incorreta para algum arquivo. Tente de novo." : "", still ? "err" : "note");
  renderBatch();
}
function batchKeyDupes() {
  const seen = {}; IMP.batch.forEach((it, i) => { it.dupInBatch = false; if (it.status !== "ok" || !it.card || !it.month) return; const k = it.card + "|" + it.month; if (seen[k] != null) it.dupInBatch = true; else seen[k] = i; });
}
function renderBatch() {
  batchKeyDupes();
  const B = IMP.batch;
  const okItems = B.filter(it => it.status === "ok" && it.card.trim() && /^\d{4}-\d{2}$/.test(it.month) && !it.dupInBatch);
  const stLabel = it => it.status === "lendo" ? '<span class="note">lendo…</span>' : it.status === "senha" ? '<span class="up">com senha</span>' : it.status === "erro" ? '<span class="up">não consegui ler</span>' : it.status === "vazio" ? '<span class="up">sem lançamentos</span>'
    : it.dupInBatch ? '<span class="up">mês repetido no lote</span>' : !it.card.trim() || !it.month ? '<span class="up">informe cartão e mês</span>'
    : STATE.statements.some(s => s.card === it.card.trim() && s.month === it.month) ? '<span class="note">substitui a atual</span>' : '<span class="down">pronta</span>';
  $("#impPreview").innerHTML = `<div class="prevwrap"><table><thead><tr><th>Arquivo</th><th>Cartão</th><th>Mês da fatura</th><th class="r">Lançamentos</th><th class="r">Compras</th><th>Situação</th></tr></thead><tbody>${B.map((it, i) => {
    const sp = it.rows.filter(r => r.keep && r.amount > 0).reduce((a, r) => a + r.amount, 0);
    const people = [...new Set(it.rows.map(r => r.who).filter(Boolean))];
    return `<tr><td><span class="desc" title="${esc(it.name)}">${esc(it.name)}</span>${people.length > 1 ? '<span class="note">' + esc(people.join(" · ")) + "</span>" : ""}</td>
      <td><input type="text" list="cardList" data-bcard="${i}" value="${esc(it.card)}" placeholder="Cartão" style="width:140px" ${it.status !== "ok" ? "disabled" : ""}></td>
      <td><input type="month" data-bmonth="${i}" value="${esc(it.month)}" ${it.status !== "ok" ? "disabled" : ""}></td>
      <td class="r num">${it.rows.length || "—"}</td><td class="r num">${it.rows.length ? BRL.format(sp) : "—"}</td><td>${stLabel(it)}</td></tr>`; }).join("")}</tbody></table></div>`;
  const tot = okItems.reduce((a, it) => a + it.rows.filter(r => r.keep && r.amount > 0).reduce((x, r) => x + r.amount, 0), 0);
  $("#impSum").innerHTML = okItems.length + " de " + B.length + " faturas prontas · compras " + BRL.format(tot);
  $("#impSave").disabled = !okItems.length || B.some(it => it.status === "lendo");
  $("#impSave").textContent = okItems.length > 1 ? "Salvar " + okItems.length + " faturas" : "Salvar fatura";
}
function saveBatch() {
  batchKeyDupes();
  const ok = IMP.batch.filter(it => it.status === "ok" && it.card.trim() && /^\d{4}-\d{2}$/.test(it.month) && !it.dupInBatch);
  let n = 0, lanc = 0;
  ok.forEach(it => {
    const card = it.card.trim(), ref = it.month;
    const tx = it.rows.filter(r => r.keep).map(r => ({id: uid(), date: toISO(r.d, ref), desc: r.desc.slice(0, 120), amount: Math.round(r.amount * 100) / 100, inst: r.inst || null, orig: r.orig || null, who: r.who || null, final: r.final || null, cat: null, ign: false})).filter(t => t.date).sort((a, b) => a.date.localeCompare(b.date));
    const dup = STATE.statements.find(s => s.card === card && s.month === ref);
    const st = {kind: "statement", id: dup ? dup.id : "st-" + uid(), card, month: ref, fileName: it.name, importedAt: new Date().toISOString(), tx};
    if (it.meta && it.meta.iofSaved) st.iofSaved = it.meta.iofSaved;
    if (JSON.stringify(st).length > 240000) return;
    Store.saveStatement(st); n++; lanc += tx.length;
  });
  closeImport(); STATE.card = "all"; STATE.view = "overview"; render();
  toast(n + " fatura" + (n === 1 ? "" : "s") + " salva" + (n === 1 ? "" : "s") + " com " + lanc + " lançamentos.");
}

/* ---------- classificação com Claude ---------- */
const sampleReady = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
async function aiClassify(btn) {
  const sm = await sampleReady; if (!sm) return;
  const keys = [...new Set(allTx().filter(t => isSpend(t) && t.c === "Outros").map(t => merchantKey(t.desc) || t.desc))].slice(0, 120);
  if (!keys.length) return;
  btn.disabled = true; btn.textContent = "Classificando…";
  const cats = allCats().filter(c => c !== "Tarifas e juros");
  try {
    const res = await sm.json(`Você classifica estabelecimentos de fatura de cartão de crédito brasileira em categorias de gasto.
Categorias permitidas (use exatamente estes nomes): ${JSON.stringify(cats)}.
Estabelecimentos (texto da fatura, normalizado): ${JSON.stringify(keys)}.
Responda somente um objeto JSON que mapeia cada estabelecimento à categoria mais provável. Use "Outros" se não der para saber.`, {modelTier: "quick"});
    let n = 0;
    if (res && typeof res === "object") Object.entries(res).forEach(([k, c]) => { if (keys.includes(k) && cats.includes(c) && c !== "Outros") { STATE.settings.rules[k] = c; n++; } });
    Store.saveSettings(); render(); toast(n ? n + " estabelecimentos classificados. Você pode ajustar em Categorias." : "Claude não conseguiu classificar esses estabelecimentos.");
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Classificar "Outros" com Claude';
    if (e && e.code === "not_granted") btn.hidden = true;
    else toast(e && e.code === "rate_limited" ? "Muitas solicitações. Tente daqui a pouco." : "Não foi possível classificar agora.");
  }
}

/* ---------- toast e tooltip ---------- */
let toastT;
function toast(text, actLabel, act) {
  const t = $("#toast"); t.innerHTML = ""; const s = document.createElement("span"); s.textContent = text; t.appendChild(s);
  if (actLabel) { const b = document.createElement("button"); b.type = "button"; b.textContent = actLabel; b.onclick = () => { t.hidden = true; act(); }; t.appendChild(b); }
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, actLabel ? 9000 : 4000);
}
const tip = $("#tip");
document.addEventListener("pointerover", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (!el) { tip.hidden = true; return; } tip.textContent = el.getAttribute("data-tip"); tip.hidden = false; });
document.addEventListener("pointermove", e => { if (tip.hidden) return; const w = tip.offsetWidth; let x = e.clientX + 12; if (x + w > window.innerWidth - 8) x = e.clientX - w - 12; tip.style.left = Math.max(8, x) + "px"; tip.style.top = (e.clientY + 14) + "px"; });
document.addEventListener("scroll", () => tip.hidden = true, true);

/* ---------- eventos ---------- */
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (!b) return; STATE.view = b.dataset.view; pendingDelete = null; saveUi(); render(); });
$("#periodSeg").addEventListener("click", e => { const b = e.target.closest("button[data-p]"); if (!b) return; STATE.period = +b.dataset.p; STATE.txMonth = "all"; saveUi(); render(); });
$("#cardSel").onchange = e => { STATE.card = e.target.value; STATE.txMonth = "all"; render(); };
$("#personSeg").addEventListener("click", e => { const b = e.target.closest("button[data-person]"); if (!b) return; STATE.person = b.getAttribute("data-person"); render(); });
$("#btnImport").onclick = openImport;
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-cat],[data-ign],[data-askdel],[data-del],[data-undel],[data-delrule],[data-delcat],[data-delcard],#aiBtn"); if (!t) return;
  if (t.id === "aiBtn") return aiClassify(t);
  const a = t.dataset.act;
  if (a === "import") return openImport();
  if (a === "clearFocus") { STATE.focusCat = null; return render(); }
  if (a === "goBackup") { STATE.view = "rules"; saveUi(); return render(); }
  if (a === "goCards") { STATE.view = "statements"; saveUi(); return render(); }
  if (a === "goOthers") { STATE.view = "tx"; STATE.txCat = "Outros"; return render(); }
  if (t.dataset.cat != null) { STATE.focusCat = STATE.focusCat === t.dataset.cat ? null : t.dataset.cat; return render(); }
  if (t.dataset.ign) return toggleIgnore(t.dataset.st, t.dataset.ign);
  if (t.dataset.askdel) { pendingDelete = t.dataset.askdel; return render(); }
  if (t.dataset.undel) { pendingDelete = null; return render(); }
  if (t.dataset.del) { const s = STATE.statements.find(x => x.id === t.dataset.del); Store.deleteStatement(t.dataset.del); pendingDelete = null; render(); if (s) toast("Fatura " + s.card + " de " + monthLabel(s.month) + " excluída."); return; }
  if (t.dataset.delcard) { const c = t.dataset.delcard; const o = Object.assign({}, STATE.settings.cards || {}); delete o[c]; STATE.settings.cards = o; Store.saveSettings(); return render(); }
  if (t.dataset.delrule) { delete STATE.settings.rules[t.dataset.delrule]; Store.saveSettings(); return render(); }
  if (t.dataset.delcat) { const c = t.dataset.delcat; STATE.settings.customCats = STATE.settings.customCats.filter(x => x !== c); Object.keys(STATE.settings.rules).forEach(k => { if (STATE.settings.rules[k] === c) delete STATE.settings.rules[k]; }); Store.saveSettings(); return render(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.tx) return setTxCategory(t.dataset.st, t.dataset.tx, t.value);
  if (t.dataset && t.dataset.rule) { STATE.settings.rules[t.dataset.rule] = t.value; Store.saveSettings(); return render(); }
  if (t.dataset && t.dataset.cfg) {
    const card = t.closest("[data-card]").getAttribute("data-card"); const k = t.dataset.cfg;
    const cur = Object.assign({}, cardsCfg()[card] || {}); delete cur.preset;
    if (k === "rate" || k === "rateIntl" || k === "type") delete cur.tiers;
    cur[k] = (k === "type" || k === "unit") ? t.value : parseNum(t.value);
    if (k === "type" && !t.value) delete cur.type;
    STATE.settings.cards = Object.assign({}, STATE.settings.cards || {}, {[card]: cur}); Store.saveSettings(); return render();
  }
  if (t.dataset && t.dataset.reward) {
    const st = STATE.statements.find(s => s.id === t.dataset.reward); if (!st) return;
    const n = parseNum(t.value); const nst = Object.assign({}, st); if (n == null) delete nst.reward; else nst.reward = n;
    Store.saveStatement(nst); return render();
  }
  if (t.dataset && t.dataset.bcard != null && IMP.batch) { IMP.batch[+t.dataset.bcard].card = t.value; return renderBatch(); }
  if (t.dataset && t.dataset.bmonth != null && IMP.batch) { IMP.batch[+t.dataset.bmonth].month = t.value; return renderBatch(); }
  if (t.dataset && t.dataset.keep != null) { IMP.rows[+t.dataset.keep].keep = t.checked; return renderPreview(); }
});
// diálogo
const drop = $("#drop"), fileIn = $("#file");
drop.onclick = () => fileIn.click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileIn.click(); } };
fileIn.onchange = () => { if (fileIn.files.length) handleFiles(fileIn.files); };
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
$("#pwdGo").onclick = async () => { if (IMP.batch) return retryBatchPassword($("#pwd").value); const rows = await readPdf($("#pwd").value); if (rows) { $("#pwdRow").hidden = true; setRows(rows); } };
$("#pwd").onkeydown = e => { if (e.key === "Enter") $("#pwdGo").click(); };
$("#pasteGo").onclick = () => { const t = $("#pasteTxt").value; if (!t.trim()) return; IMP.fileName = "texto colado"; let rows = parseTextLines(t.split(/\r?\n/)); if (!rows.length) rows = parseCSV(t); setRows(rows); };
$("#impMonth").onchange = () => IMP.rows.length && renderPreview();
$("#impCard").oninput = () => IMP.rows.length && renderPreview();
$("#impSave").onclick = () => IMP.batch ? saveBatch() : saveImport();
$("#impCancel").onclick = closeImport; $("#dlgClose").onclick = closeImport;

render();
Store.init();
})();
</script>
